name: Text check

# Everything in this repository is public, so its text is checked on every
# pull request to main.
#
#   1. scripts/brand-check.sh, the same script our other repositories run, and
#      its tests. It scans page-type files only, which here means the profile
#      (scripts/brand-check.paths says so).
#   2. Every other public text file (Markdown anywhere, and .github/) for the
#      same em dash, retired-phrase and banned-word rules. The script picks
#      files by type and a paths entry can only narrow that, so this step
#      covers what it cannot. This file is left out: it holds the patterns.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: brand and text check
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Brand check
        run: ./scripts/brand-check.sh

      - name: Brand check tests
        run: ./scripts/brand-check.test.sh

      - name: Other public text
        run: |
          git ls-files -z -- '*.md' '.github/' ':!:.github/workflows/text-check.yml' \
            | xargs -0 perl -ne '
                BEGIN {
                  $dash    = qr/\xe2\x80\x94|&mdash;|&#8212;|&#x2014;|\\u2014/i;
                  $retired = qr/technology solutions and product company|from business problems to working solutions/i;
                  $banned  = qr/\b(?:best|world[- ]class|user[- ]centric|human[- ]cent(?:red|ered)|revolutioni[sz](?:e|es|ed|ing)|seamless(?:ly)?|cutting[- ]edge|unlock(?:s|ed|ing)?|game[- ]chang(?:er|ers|ing))\b/i;
                  $bad = 0; $n = 0;
                }
                $n++ if $. == 1;
                for my $r (["em-dash", $dash], ["retired", $retired], ["banned", $banned]) {
                  if ($_ =~ $r->[1]) { print "$ARGV:$.: [$r->[0]] $_"; $bad = 1; }
                }
                close ARGV if eof;
                END {
                  print $bad ? "text check: failed\n" : "text check: clean ($n files)\n";
                  exit $bad;
                }'
