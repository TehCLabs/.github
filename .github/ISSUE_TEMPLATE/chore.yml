name: Chore
description: Maintenance, refactor, dependency, docs or infrastructure work
labels: ["needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations: {required: true}
  - type: textarea
    id: why-now
    attributes:
      label: Why now
      description: What gets worse if this waits? Chores without this answer tend to sit open for a year.
    validations: {required: true}
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Backend, Web, Mobile, Infra, Docs]
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes:
      label: How much does this matter
      options:
        - "P1: something breaks or stays at risk until this is done"
        - "P2: it gets worse if it waits"
        - "P3: nice to have"
    validations: {required: true}
